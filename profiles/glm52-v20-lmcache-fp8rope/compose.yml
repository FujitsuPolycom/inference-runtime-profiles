services:
  inference:
    image: ${IMAGE_DIGEST}
    gpus: all
    ipc: host
    network_mode: host
    shm_size: 32g
    restart: unless-stopped
    entrypoint: [/opt/profile/start-v20-lmcache.sh]
    environment:
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      MODEL: /model
      SERVED_MODEL_NAME: GLM-5.2
      PORT: "${PORT}"
      TP: "${TP}"
      DCP: "${DCP}"
      MTP: "${MTP}"
      MODEL_FAMILY: glm52-hybrid
      GPU_MEMORY_UTILIZATION: "0.9640"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN}"
      KV_FP8_ROPE: "1"
      MAX_BATCHED_TOKENS: "3072"
      GRAPH: "32"
      DCP_PREFILL_WORKSPACE: auto
      DCP_QUERY_SPLIT: "0"
      DCP_CKV_GATHER: "1"
      VLLM_DCP_REPLICATE_INDEXER_CACHE: "0"
      VLLM_B12X_MLA_SPARSE_DECODE_CKV_GATHER: "0"
      VLLM_B12X_MLA_SPARSE_DECODE_BULK_PREFETCH: "0"
      VLLM_ENABLE_PCIE_ALLREDUCE: "1"
      VLLM_PCIE_ALLREDUCE_BACKEND: cpp
      VLLM_CPP_AR_1STAGE_NCCL_CUTOFF: 56KB
      VLLM_RTX6K_FUSED_ALLREDUCE_ADD: "0"
      VLLM_RTX6K_FUSED_ALLREDUCE_ADD_END_BARRIER: "0"
      LMCACHE_L1_GB: "48"
      LMCACHE_L1_INIT_GB: "48"
      LMCACHE_CHUNK_SIZE: "512"
      LMCACHE_DCP_GROUPED: "1"
      LMCACHE_LOCAL_CPU: "True"
      LMCACHE_MAX_LOCAL_CPU_SIZE: "48"
      LMCACHE_LOCAL_DISK: file:///lmcache-l2
      LMCACHE_LOCAL_DISK_PATH_SHARDING: by_gpu
      LMCACHE_MAX_LOCAL_DISK_SIZE: "96"
      LMCACHE_ENABLE_ASYNC_LOADING: "False"
      LMCACHE_SAVE_DECODE_CACHE: "False"
      LMCACHE_USE_LAYERWISE: "False"
      LMCACHE_L2_PATH: /lmcache-l2
      LMCACHE_L2_GB: "96"
      LMCACHE_PORT: "5555"
      LMCACHE_HTTP_PORT: "8089"
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${CACHE_DIR}:/cache:rw
      - ${L2_DIR}:/lmcache-l2:rw
      - ../../tools/start-v20-lmcache.sh:/opt/profile/start-v20-lmcache.sh:ro
