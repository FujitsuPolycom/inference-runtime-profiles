services:
  inference:
    image: ${IMAGE_DIGEST}
    gpus: all
    network_mode: host
    ipc: host
    shm_size: 68719476736
    restart: unless-stopped
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      MASTER_ADDR: ${MASTER_ADDR}
      MASTER_PORT: ${MASTER_PORT}
      GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME}
      TP_SOCKET_IFNAME: ${TP_SOCKET_IFNAME}
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: ${NCCL_IB_HCA}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      NCCL_IB_GID_INDEX: "0"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      NCCL_NET_GDR_LEVEL: "5"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TORCH_CUDA_ARCH_LIST: 12.1a
      TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      FLASHINFER_WORKSPACE_BASE: /cache/huggingface/flashinfer
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      VLLM_NCCL_SO_PATH: /opt/env/lib/python3.12/site-packages/nvidia/nccl/lib/libnccl.so.2
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      B12X_W4A16_TC_DECODE: "0"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: ""
      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: off
      VLLM_DSPARK_LOCAL_ARGMAX: "1"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
      VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "1"
      VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "1"
      VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "0"
      VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: "0"
      VLLM_DSV4_B12X_COMPRESSED_MLA: "0"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: "0"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: "0"
      VLLM_TRITON_MLA_SPARSE: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      MTP_NUM_TOKENS: "3"
      VLLM_ENFORCE_STRICT_TOOL_CALLING: "0"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_SKIP_INIT_MEMORY_CHECK: "1"
      VLLM_HOST_IP: ${MASTER_ADDR}
    volumes:
      - ${HF_CACHE_DIR}:/cache/huggingface:rw
      - ${DSPARK_PROPOSER_PATH}:/opt/env/lib/python3.12/site-packages/vllm/v1/spec_decode/dspark_proposer.py:ro
    entrypoint: [bash, -lc]
    command:
      - >-
        exec /opt/env/bin/vllm serve ${MODEL_ID}
        --served-model-name ${SERVED_MODEL_NAME}
        --host 0.0.0.0 --port ${PORT}
        --trust-remote-code
        --tensor-parallel-size ${TP}
        --pipeline-parallel-size ${PP}
        --kv-cache-dtype nvfp4_ds_mla
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN}
        --max-num-seqs ${MAX_NUM_SEQS}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS}
        --max-cudagraph-capture-size $(( ${MAX_NUM_SEQS} * (${MTP} + 1) ))
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION}
        --kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES}
        --enable-prefix-caching --async-scheduling --enable-chunked-prefill
        --speculative-config '{"method":"dspark","num_speculative_tokens":${MTP},"draft_sample_method":"probabilistic"}'
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --tool-call-parser deepseek_v4 --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"\u1010","reasoning_end_str":"\u1011"}'
        --default-chat-template-kwargs '{"thinking":false}'
        --generation-config vllm
        --enable-flashinfer-autotune
        --nnodes 2 --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR} --master-port ${MASTER_PORT}
