services:
  inference:
    image: ${IMAGE_DIGEST}
    gpus: all
    ipc: host
    shm_size: 32g
    restart: unless-stopped
    ports:
      - "${PORT}:5802"
    entrypoint: [vllm]
    command:
      - serve
      - /model
      - --served-model-name=GLM-5.2-MXFP8-NVFP4-NF3-Hybrid
      - --host=0.0.0.0
      - --port=5802
      - --trust-remote-code
      - --tensor-parallel-size=${TP}
      - --decode-context-parallel-size=${DCP}
      - --dcp-comm-backend=a2a
      - --dcp-kv-cache-interleave-size=1
      - --kv-cache-dtype=nvfp4_ds_mla
      - --attention-backend=B12X_MLA_SPARSE
      - --moe-backend=b12x
      - --quantization=nvfp4_nf3_hybrid
      - --load-format=instanttensor
      - -cc.pass_config.fuse_allreduce_rms=True
      - --gpu-memory-utilization=0.98
      - --kv-cache-memory-bytes=3489660928
      - --max-model-len=300000
      - --max-num-seqs=8
      - --max-num-batched-tokens=3072
      - --max-cudagraph-capture-size=32
      - --async-scheduling
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-flashinfer-autotune
      - --speculative-config={"model":"/model","method":"mtp","num_speculative_tokens":3,"moe_backend":"b12x","draft_sample_method":"probabilistic"}
      - --kv-transfer-config={"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}
    environment:
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      CUDA_DEVICE_MAX_CONNECTIONS: "32"
      KV_FP8_ROPE: "0"
      TP: "${TP}"
      DCP: "${DCP}"
      MTP: "${MTP}"
      DCP_PREFILL_WORKSPACE: auto
      VLLM_DCP_GLOBAL_TOPK: "1"
      VLLM_DCP_PROJECT_BEFORE_MERGE: "1"
      VLLM_DCP_PROJECT_BEFORE_MERGE_MIN_PREFILL_TOKENS: "1024"
      VLLM_DCP_REPLICATE_INDEXER_CACHE: "1"
      VLLM_DCP_QUERY_SPLIT: "0"
      VLLM_B12X_MLA_CKV_GATHER: "1"
      VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "300000"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "3"
      VLLM_B12X_MLA_DCP_GATHER_IN_WORKSPACE: "1"
      VLLM_B12X_MLA_SPARSE_DECODE_CKV_GATHER: "1"
      VLLM_B12X_MLA_SPARSE_DECODE_TRANSPORT: ce
      VLLM_B12X_MLA_SPARSE_DECODE_BULK_PREFETCH: "1"
      VLLM_B12X_MLA_SPARSE_DECODE_MAX_SEQS: "8"
      ALLREDUCE_MODE: nccl
      VLLM_ENABLE_PCIE_ALLREDUCE: "0"
      VLLM_ALLOW_CUSTOM_ALLREDUCE_PCIE: "0"
      VLLM_RTX6K_FUSED_ALLREDUCE_ADD: "0"
      LMCACHE_LOCAL_CPU: "True"
      LMCACHE_MAX_LOCAL_CPU_SIZE: "48"
      LMCACHE_CHUNK_SIZE: "256"
      LMCACHE_DCP_GROUPED: "1"
      LMCACHE_USE_GPU_CONNECTOR_V3: "True"
      LMCACHE_USE_LAYERWISE: "False"
      LMCACHE_ENABLE_ASYNC_LOADING: "False"
      LMCACHE_SAVE_DECODE_CACHE: "False"
      VLLM_NVFP4_MLA_SCALES_FILE: /config/mla-scales.json
      VLLM_USE_B12X_PCIE_DMA: "0"
      VLLM_PCIE_DMA_FP8: "0"
      B12X_PCIE_DMA_FP8: "0"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      VLLM_DISABLED_KERNELS: MarlinFP8ScaledMMLinearKernel
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${CACHE_DIR}:/cache:rw
      - ${SCALE_FILE}:/config/mla-scales.json:ro

