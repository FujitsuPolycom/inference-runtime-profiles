services:
  inference:
    image: ${IMAGE_DIGEST}
    gpus: all
    restart: unless-stopped
    ports:
      - "${PORT}:8000"
    environment:
      TP: "${TP}"
      DCP: "${DCP}"
      MTP: "${MTP}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION}"
    volumes:
      - ${MODEL_DIR}:/model:ro
      - ${CACHE_DIR}:/cache:rw

